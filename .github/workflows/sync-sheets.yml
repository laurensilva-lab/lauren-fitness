name: Sincronizar Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar desde Google Sheets
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node scripts/sync-sheets.mjs

      - name: Verificar cambios
        id: changes
        run: |
          git diff --quiet src/data/workoutData.js || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit si hay cambios
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Coach Sync Bot"
          git config user.email "sync@lauren-fitness.app"
          git add src/data/workoutData.js
          git commit -m "sync: actualización desde Google Sheets $(date +'%d/%m/%Y %H:%M')"
          git push

      - name: Sin cambios
        if: steps.changes.outputs.changed != 'true'
        run: echo "Sin cambios en la planilla"
