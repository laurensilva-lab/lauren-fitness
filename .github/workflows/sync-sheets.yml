# ============================================================
# WORKFLOW: sync-sheets.yml
# Se ejecuta automáticamente cuando el coach actualiza la Sheet.
# También se puede disparar manualmente desde GitHub.
# ============================================================
name: Sincronizar Google Sheets

on:
  # Disparo manual desde GitHub → Actions → "Run workflow"
  workflow_dispatch:

  # Disparo automático cada día a las 8am (UTC-3 = 11am Argentina)
  # Cambiá el horario si querés otra hora
  schedule:
    - cron: '0 11 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar desde Google Sheets
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node scripts/sync-sheets.mjs

      - name: Verificar si hubo cambios
        id: changes
        run: |
          git diff --quiet src/data/workoutData.js || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit y push si hay cambios
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "Coach Sync Bot"
          git config user.email "sync@lauren-fitness.app"
          git add src/data/workoutData.js
          git commit -m "sync: actualización automática desde Google Sheets $(date +'%d/%m/%Y %H:%M')"
          git push
          echo "✅ App actualizada — Vercel redesployará en ~2 minutos"

      - name: Sin cambios
        if: steps.changes.outputs.changed != 'true'
        run: echo "ℹ️ Sin cambios en la planilla"
